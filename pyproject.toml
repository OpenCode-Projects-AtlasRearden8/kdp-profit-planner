[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kdp-profit-planner"
version = "0.1.0"
description = "Local-first KDP publishing plan calculator: page counts, printing costs, royalties, break-even units, series price scenarios, and monthly projections."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Asdale Dynamics, LLC" }]
keywords = ["kdp", "self-publishing", "amazon", "royalty", "author", "profit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Other/Nonlisted Topic",
]

[project.scripts]
kdp-profit-planner = "kdp_profit_planner.cli:main"

[tool.setuptools.packages.find]
include = ["kdp_profit_planner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
